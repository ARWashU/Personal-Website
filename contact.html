<script src="script.js"></script>
<script>
  const message = "Thank you for viewing my portfolio. Look forward to hearing from you!";
  const typeTarget = document.getElementById("typewriter-message");
  let i = 0;

  function typeWriterEffect() {
    if (i < message.length) {
      typeTarget.innerHTML += message.charAt(i);
      i++;
      setTimeout(typeWriterEffect, 40); // typing speed
    }
  }

  window.addEventListener('load', typeWriterEffect);
</script>
