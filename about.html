<script src="script.js"></script>
<script>
  const text = `I am a Sophomore at Washington University in St. Louis studying CS and Business with a concentration in Business Analytics. I am passionate about the intersection of finance and data science. In my free time, I love to work out, play basketball, hike, and play card games. Feel free to contact me at a.ramabadran@wustl.edu. Here are some flicks from sophomore year.`;

  const el = document.getElementById('typewriter');
  let i = 0;

  function typeWriter() {
    if (i < text.length) {
      el.innerHTML += text[i] === '\n' ? '<br>' : text[i];
      i++;
      setTimeout(typeWriter, 40);
    }
  }

  window.addEventListener('load', typeWriter);
</script>
